version: '3.8'

services:
  # Backend API
  backend:
    build: .
    container_name: anomaly-detection-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/anomaly_detection
      - REDIS_URL=redis://redis:6379/0
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - anomaly-network

  # Frontend
  frontend:
    image: nginx:alpine
    container_name: anomaly-detection-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - anomaly-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: anomaly-detection-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=anomaly_detection
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - anomaly-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: anomaly-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - anomaly-network

  # Celery Worker (for async tasks)
  celery_worker:
    build: .
    container_name: anomaly-detection-celery-worker
    command: celery -A backend.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/anomaly_detection
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - anomaly-network

  # Flower (Celery monitoring)
  flower:
    build: .
    container_name: anomaly-detection-flower
    command: celery -A backend.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - anomaly-network

networks:
  anomaly-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
